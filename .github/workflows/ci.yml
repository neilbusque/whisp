name: macOS checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check toolchain
        run: swift --version
      - name: Check shell scripts
        run: bash -n build.sh scripts/fetch-whisper.sh scripts/setup-signing.sh
      - name: Test
        run: swift test -j 2
      - name: Build app
        run: ./build.sh
      - name: Verify app signature and notices
        run: |
          codesign --verify --deep --strict Whisp.app
          test -f Whisp.app/Contents/Resources/LICENSE.txt
          test -f Whisp.app/Contents/Resources/whisper-cpp-LICENSE.txt
